openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: check-in
    description: Student health center check-in operations
  - name: kiosk-content
    description: Staff-managed kiosk wording
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kiosk/content:
    get:
      operationId: getKioskContent
      tags: [kiosk-content]
      summary: Get the saved kiosk content
      responses:
        "200":
          description: Saved kiosk content, or the stable defaults when no valid content has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskContent"
    put:
      operationId: updateKioskContent
      tags: [kiosk-content]
      summary: Save kiosk content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskContentUpdate"
      responses:
        "200":
          description: Updated kiosk content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskContent"
        "400":
          description: Invalid kiosk content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /kiosk/content/reset:
    post:
      operationId: resetKioskContent
      tags: [kiosk-content]
      summary: Reset one screen or all kiosk content to defaults
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskContentReset"
      responses:
        "200":
          description: Reset kiosk content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskContent"
  /checkin/sessions:
    post:
      operationId: identifyCheckIn
      tags: [check-in]
      summary: Start a student check-in session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInIdentification"
      responses:
        "200":
          description: Check-in session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid identification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/verify:
    post:
      operationId: verifyCheckIn
      tags: [check-in]
      summary: Verify a secure code for clients that use step-up verification
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCode"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/appointment:
    patch:
      operationId: saveCheckInAppointment
      tags: [check-in]
      summary: Select the appointment for a check-in session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentSelection"
      responses:
        "200":
          description: Appointment selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/demographics:
    patch:
      operationId: saveCheckInDemographics
      tags: [check-in]
      summary: Save student contact details
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Demographics"
      responses:
        "200":
          description: Demographics saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or demographics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/coverage:
    patch:
      operationId: saveCheckInCoverage
      tags: [check-in]
      summary: Save insurance or self-pay selection
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageSelection"
      responses:
        "200":
          description: Coverage selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or coverage selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/consent:
    post:
      operationId: saveCheckInConsent
      tags: [check-in]
      summary: Save consent and signature
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Consent saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/questionnaire:
    post:
      operationId: saveCheckInQuestionnaire
      tags: [check-in]
      summary: Save questionnaire answers
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireInput"
      responses:
        "200":
          description: Questionnaire saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or questionnaire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/history:
    post:
      operationId: saveCheckInHistory
      tags: [check-in]
      summary: Save medical history confirmation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryInput"
      responses:
        "200":
          description: Medical history saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid session or history selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkin/sessions/{sessionId}/complete:
    post:
      operationId: completeCheckIn
      tags: [check-in]
      summary: Complete student check-in
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Check-in completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResult"
        "400":
          description: Invalid or incomplete check-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    KioskContentScreenId:
      type: string
      enum: [welcome, appointment, details, coverage, consent, questions, checking, complete]
    KioskContentWelcome:
      type: object
      properties:
        eyebrow: { type: string, minLength: 1, maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 240 }
        titleAccent: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, minLength: 1, maxLength: 500 }
        duration: { type: string, minLength: 1, maxLength: 80 }
        durationNote: { type: string, minLength: 1, maxLength: 160 }
        startEyebrow: { type: string, minLength: 1, maxLength: 120 }
        startTitle: { type: string, minLength: 1, maxLength: 180 }
        privacyNote: { type: string, minLength: 1, maxLength: 240 }
        demoInstructions: { type: string, minLength: 1, maxLength: 500 }
        qrPrompt: { type: string, minLength: 1, maxLength: 180 }
        qrDescription: { type: string, minLength: 1, maxLength: 400 }
        findVisitButton: { type: string, minLength: 1, maxLength: 100 }
        qrButton: { type: string, minLength: 1, maxLength: 100 }
      required: [eyebrow, title, titleAccent, description, duration, durationNote, startEyebrow, startTitle, privacyNote, demoInstructions, qrPrompt, qrDescription, findVisitButton, qrButton]
    KioskContentAppointment:
      type: object
      properties:
        scheduledHeading: { type: string, minLength: 1, maxLength: 180 }
        scheduledDescription: { type: string, minLength: 1, maxLength: 300 }
        confirmButton: { type: string, minLength: 1, maxLength: 100 }
        noAppointmentHeading: { type: string, minLength: 1, maxLength: 180 }
        noAppointmentDescription: { type: string, minLength: 1, maxLength: 300 }
        frontDeskLabel: { type: string, minLength: 1, maxLength: 120 }
        frontDeskDescription: { type: string, minLength: 1, maxLength: 300 }
        scheduleLabel: { type: string, minLength: 1, maxLength: 120 }
        scheduleDescription: { type: string, minLength: 1, maxLength: 300 }
        frontDeskConfirmation: { type: string, minLength: 1, maxLength: 300 }
        schedulingHeading: { type: string, minLength: 1, maxLength: 180 }
        schedulingUnavailable: { type: string, minLength: 1, maxLength: 300 }
        backToOptionsButton: { type: string, minLength: 1, maxLength: 140 }
      required: [scheduledHeading, scheduledDescription, confirmButton, noAppointmentHeading, noAppointmentDescription, frontDeskLabel, frontDeskDescription, scheduleLabel, scheduleDescription, frontDeskConfirmation, schedulingHeading, schedulingUnavailable, backToOptionsButton]
    KioskContentDetails:
      type: object
      properties:
        heading: { type: string, minLength: 1, maxLength: 180 }
        continueButton: { type: string, minLength: 1, maxLength: 100 }
      required: [heading, continueButton]
    KioskContentCoverage:
      type: object
      properties:
        heading: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 300 }
        selfPayTitle: { type: string, minLength: 1, maxLength: 120 }
        selfPayDescription: { type: string, minLength: 1, maxLength: 240 }
        iuOptionTitle: { type: string, minLength: 1, maxLength: 140 }
        iuOptionDescription: { type: string, minLength: 1, maxLength: 240 }
        otherOptionTitle: { type: string, minLength: 1, maxLength: 160 }
        otherOptionDescription: { type: string, minLength: 1, maxLength: 240 }
        insuranceHeading: { type: string, minLength: 1, maxLength: 180 }
        updateInsuranceButton: { type: string, minLength: 1, maxLength: 180 }
        viewInsuranceButton: { type: string, minLength: 1, maxLength: 180 }
        confirmButton: { type: string, minLength: 1, maxLength: 100 }
      required: [heading, description, selfPayTitle, selfPayDescription, iuOptionTitle, iuOptionDescription, otherOptionTitle, otherOptionDescription, insuranceHeading, updateInsuranceButton, viewInsuranceButton, confirmButton]
    KioskContentConsent:
      type: object
      properties:
        heading: { type: string, minLength: 1, maxLength: 180 }
        noticeFirstParagraph: { type: string, minLength: 1, maxLength: 1000 }
        noticeSecondParagraph: { type: string, minLength: 1, maxLength: 700 }
        agreementLabel: { type: string, minLength: 1, maxLength: 240 }
        signatureLabel: { type: string, minLength: 1, maxLength: 140 }
        signaturePlaceholder: { type: string, minLength: 1, maxLength: 100 }
        continueButton: { type: string, minLength: 1, maxLength: 100 }
      required: [heading, noticeFirstParagraph, noticeSecondParagraph, agreementLabel, signatureLabel, signaturePlaceholder, continueButton]
    KioskContentQuestions:
      type: object
      properties:
        heading: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 300 }
        continueButton: { type: string, minLength: 1, maxLength: 100 }
      required: [heading, description, continueButton]
    KioskContentChecking:
      type: object
      properties:
        heading: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 240 }
      required: [heading, description]
    KioskContentComplete:
      type: object
      properties:
        badge: { type: string, minLength: 1, maxLength: 120 }
        kioskFloorPrefix: { type: string, minLength: 1, maxLength: 120 }
        directionsSuffix: { type: string, minLength: 1, maxLength: 240 }
        destinationFallback: { type: string, minLength: 1, maxLength: 120 }
        waitingAreaFallback: { type: string, minLength: 1, maxLength: 120 }
        visitConfirmed: { type: string, minLength: 1, maxLength: 120 }
        providerLabel: { type: string, minLength: 1, maxLength: 100 }
        visitLabel: { type: string, minLength: 1, maxLength: 100 }
        timeLabel: { type: string, minLength: 1, maxLength: 100 }
        doneButton: { type: string, minLength: 1, maxLength: 100 }
        demoNotice: { type: string, minLength: 1, maxLength: 240 }
      required: [badge, kioskFloorPrefix, directionsSuffix, destinationFallback, waitingAreaFallback, visitConfirmed, providerLabel, visitLabel, timeLabel, doneButton, demoNotice]
    KioskContent:
      type: object
      properties:
        welcome: { $ref: "#/components/schemas/KioskContentWelcome" }
        appointment: { $ref: "#/components/schemas/KioskContentAppointment" }
        details: { $ref: "#/components/schemas/KioskContentDetails" }
        coverage: { $ref: "#/components/schemas/KioskContentCoverage" }
        consent: { $ref: "#/components/schemas/KioskContentConsent" }
        questions: { $ref: "#/components/schemas/KioskContentQuestions" }
        checking: { $ref: "#/components/schemas/KioskContentChecking" }
        complete: { $ref: "#/components/schemas/KioskContentComplete" }
      required: [welcome, appointment, details, coverage, consent, questions, checking, complete]
    KioskContentUpdate:
      type: object
      properties:
        content: { $ref: "#/components/schemas/KioskContent" }
      required: [content]
    KioskContentReset:
      type: object
      properties:
        screen:
          $ref: "#/components/schemas/KioskContentScreenId"
    CheckInIdentification:
      type: object
      properties:
        method:
          type: string
          enum: [universityId, lastName, qr]
        value:
          type: string
        dateOfBirth:
          type: string
        qrToken:
          type: string
      required: [method]
    Appointment:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        time:
          type: string
        provider:
          type: string
        type:
          type: string
        location:
          type: string
        addressLine2:
          type: string
      required: [id, date, time, provider, type, location, addressLine2]
    InsuranceInformation:
      type: object
      properties:
        insuranceCarrier:
          type: string
        memberId:
          type: string
        groupNumber:
          type: string
        subscriberName:
          type: string
      required: [insuranceCarrier, memberId, groupNumber, subscriberName]
    SchedulingHandoff:
      type: object
      properties:
        mode:
          type: string
          enum: [rest, qr-link]
        available:
          type: boolean
        label:
          type: string
        message:
          type: string
        url:
          type: string
      required: [mode, available, label, message]
    ConsentForm:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        requiresSignature:
          type: boolean
        status:
          type: string
          enum: [unsigned, signed]
      required: [id, title, description, requiresSignature, status]
    QuestionnaireOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required: [id, label]
    QuestionnaireQuestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        type:
          type: string
          enum: [single_select, free_text]
        mandatory:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireOption"
      required: [id, text, type, mandatory]
    Questionnaire:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [not_started, completed_portal, completed_now]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireQuestion"
        completedAnswers:
          type: object
          additionalProperties:
            type: string
      required: [id, name, status, questions]
    StudentProfile:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
      required: [firstName, lastName, phone, email, addressLine1, addressLine2, city, state, zip]
    CheckInSession:
      type: object
      properties:
        sessionId:
          type: string
        requiresVerification:
          type: boolean
        student:
          $ref: "#/components/schemas/StudentProfile"
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        insuranceInformation:
          $ref: "#/components/schemas/InsuranceInformation"
        onFileInsuranceInformation:
          $ref: "#/components/schemas/InsuranceInformation"
        schedulingHandoff:
          $ref: "#/components/schemas/SchedulingHandoff"
        consentForms:
          type: array
          items:
            $ref: "#/components/schemas/ConsentForm"
        questionnaires:
          type: array
          items:
            $ref: "#/components/schemas/Questionnaire"
      required: [sessionId, requiresVerification, student, appointments, insuranceInformation, onFileInsuranceInformation, schedulingHandoff, consentForms, questionnaires]
    VerificationCode:
      type: object
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
      required: [code]
    VerificationResult:
      type: object
      properties:
        verified:
          type: boolean
      required: [verified]
    AppointmentSelection:
      type: object
      properties:
        appointmentId:
          type: string
      required: [appointmentId]
    Demographics:
      type: object
      properties:
        phone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
      required: [phone, addressLine1, addressLine2, city, state, zip]
    CoverageSelection:
      type: object
      properties:
        coverage:
          type: string
          enum: [iu, other, self]
        insuranceCarrier:
          type: string
        memberId:
          type: string
        groupNumber:
          type: string
        subscriberName:
          type: string
      required: [coverage]
    ConsentInput:
      type: object
      properties:
        accepted:
          type: boolean
        signatureName:
          type: string
          maxLength: 200
        formId:
          type: string
          maxLength: 200
        signatureData:
          type: string
          minLength: 100
          maxLength: 100000
          pattern: "^data:image/png;base64,"
      required: [accepted]
    QuestionnaireInput:
      type: object
      properties:
        questionnaireId:
          type: string
          maxLength: 200
        questionnaireName:
          type: string
          maxLength: 200
        answers:
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
      required: [answers]
    HistoryInput:
      type: object
      properties:
        choice:
          type: string
          enum: [same, update]
      required: [choice]
    CompletionResult:
      type: object
      properties:
        completed:
          type: boolean
        nextStep:
          type: string
        directions:
          type: string
        provider:
          type: string
        visitType:
          type: string
        appointmentTime:
          type: string
        addressLine2:
          type: string
        floorLabel:
          type: string
        waitingArea:
          type: string
        kioskFloor:
          type: string
        isCurrentFloor:
          type: boolean
      required: [completed, nextStep, directions, provider, visitType, appointmentTime, addressLine2, floorLabel, waitingArea, kioskFloor, isCurrentFloor]

